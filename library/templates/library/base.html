{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width. initial-scale=1.0">
    <title>{% block title %}Управление библиотекой{% endblock %}</title>
    <link type="text/css" href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg p-3">
        <a class="navbar-brand" href="{% url 'library:index' %}">Библиотека</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        {% with request.resolver_match.url_name as current_url %}
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link {% if current_url == 'index' %}active{% endif %}"
                       {% if current_url == 'index' %}active{% endif %}
                       href="{% url 'library:index' %}">Главная</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if current_url == 'authors_list' %}active{% endif %}"
                       href="{% url 'library:authors_list' %}">Авторы</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if current_url == 'books_list' %}active{% endif %}"
                       href="{% url 'library:book_list' %}">Книги</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link {% if current_url == 'books_list' %}active{% endif %}"
                       href="{% url 'library:contacts' %}">Контакты</a>
                </li>
            </ul>
        </div>
        {% endwith %}
    </nav>

    <div class="container mt-5">
        {% block content %}{% endblock %}
    </div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
