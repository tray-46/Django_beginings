{% extends "library/base.html" %}

{% block title %}Список книг{% endblock %}

{% block content %}
    <h2 class="mb-4">Список книг</h2>

    <ul class="list-group">
        {% for book in books %}
            <li class="list-group-item">
                <a class="text-decoration-none" href="{% url 'library:book' book.pk %}">{{ book.author }} - {{ book.title }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
