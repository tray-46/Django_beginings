{% extends "library/base.html" %}

{% block title %}Удаление книги{% endblock %}

{% block content %}
{% include "library/book_header.html" %}
    <h1>Удаление книги</h1>
    <p>Вы уверены что хотите удалить книгу: {{ book.title }}</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a class="btn btn-secondary" href="{% url 'library:book_list' %}">Отмена</a>
    </form>
{% endblock %}
