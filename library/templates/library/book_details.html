{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{book.title|title}}</title>
    <link href="/static/images/favicon.bmp" type="image/png" rel="icon">
    <link href="{% static 'css/bootstrap.min.css' %}" type="text/css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            {% if book.cover_art %}
                <div class="col-4">
                        <img class="img-thumbnail" src="{{ book.cover_art.url }}" alt="{{ book.author }} - {{ book.cover_art }}">
                </div>
            {% endif %}
            <div class="col-8">
                    <p>Автор: {{ book.author }}</p>
                    <p>Название: {{ book.title }}</p>
                    <p>Дата публикации: {{ book.publication_data|date:"d M Y" }}</p>
                    <p>Описание: {{ book.description|default:"Описание отсутствует"|truncatechars:100 }}</p>
            </div>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
