{% extends "library/base.html" %}

{% block title %}{% endblock %}

{% block content %}
    <h2 class="mb-4">Список авторов</h2>
    
    <ul class="list-group">
        {% for author in authors %}
            <li class="list-group-item">
                <a class="text-decoration-none" href="{% url 'library:author' author.pk %}">{{ author }}</a>
            </li>
        {% endfor %}
    </ul>
{% endblock %}
