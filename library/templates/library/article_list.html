{% extends "library/base.html" %}

{% block title %}Форма Article{% endblock %}

{% block content %}
<h1>Список статей</h1>
<a class="btn btn-primary mb-3" href="{% url 'library:article_create' %}">Добавить статью</a>
<ul class="list-group">
    {% for article in article_list %}
    <li class="list-group-item">
        <a href="{% url 'library:article_detail' article.pk %}">{{ article.title }}</a>
        <a class="btn btn-sm btn-secondary ml-3" href="{% url 'library:article_edit' article.pk %}">Редактировать</a>
        <a class="btn btn-sm btn-danger ml-1" href="{% url 'library:article_delete' article.pk %}">Удалить</a>
    </li>
    {% empty %}
    <li class="list-gruop-item">Нет статей</li>
    {% endfor %}
</ul>
{% endblock %}
