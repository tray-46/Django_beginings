{% extends "library/base.html" %}

{% block title %}Удаление Article{% endblock %}

{% block content %}
    <h1>Удаление статьи</h1>
    <p>Вы уверены что хотите удалить сталью: {{ article.title }}</p>
    <form method="POST">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a class="btn btn-secondary" href="{% url 'library:article_list' %}">Отмена</a>
    </form>
{% endblock %}
